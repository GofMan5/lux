name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.23.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod download
      - name: Run go test -race ./...
        id: gots
        shell: bash
        continue-on-error: true
        run: |
          set +e
          go test -race -count=1 ./... > test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      # The redirected output never reaches the job log on its own. Mirror
      # the whole file into this step's log (goroutine dumps included) and
      # attach it as an artifact, so authenticated `gh run view --log-failed`
      # and artifact download both expose the full evidence.
      - name: Mirror full test output into the log
        if: steps.gots.outputs.status != '0'
        shell: bash
        run: cat test-output.txt
      - name: Upload test output artifact
        if: steps.gots.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-${{ matrix.go }}
          path: test-output.txt
          retention-days: 14
      # Anonymous users cannot read job logs, so on failure we mirror the
      # verdict, any race reports, and the failing tests' own messages
      # into step annotations, which the annotations API does expose.
      - name: Report failures as annotations
        if: steps.gots.outputs.status != '0'
        shell: bash
        run: |
          # POSIX grep -E has no \t escape: match the tab with [[:blank:]]
          # so the panic dump's "running tests:" entries surface too.
          grep -E '^(--- FAIL|FAIL|panic)|WARNING: DATA RACE|Found [0-9]+ data race' test-output.txt | head -8 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          # go test prints each t.Fatal/t.Errorf message as an indented
          # file:line: entry under the failing test; mirroring those tells
          # anonymous readers WHICH wait fired, not just that one did.
          grep -E '^[[:blank:]]+[A-Za-z0-9_.-]+\.go:[0-9]+:' test-output.txt | head -8 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          grep -E '^(running tests:|[[:blank:]]+Test[A-Za-z0-9_]+ \()' test-output.txt | head -8 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          exit 1
      - run: go vet ./...

  e2e:
    name: E2E PTY (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: e2e/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...

  soak:
    name: Long-session memory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go mod download
      # Soaks drive reference apps for thousands of paced frames and compare
      # live heap after GC; race instrumentation would distort both.
      - name: Run reference-app soaks
        env:
          LUX_SOAK: "1"
        run: go test -count=1 -run '^TestLongSessionMemoryIsBounded$' -v ./examples/...

  ssh-example:
    name: SSH example (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/07-ssh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: examples/07-ssh/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build .
      - name: Run go test -race ./...
        id: gots
        continue-on-error: true
        run: |
          set +e
          go test -race -count=1 ./... > test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      # Same evidence net as the test matrix: full output into the log plus
      # an artifact, before the annotation step marks the job failed.
      - name: Mirror full test output into the log
        if: steps.gots.outputs.status != '0'
        shell: bash
        run: cat test-output.txt
      - name: Upload test output artifact
        if: steps.gots.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-test-output-${{ matrix.os }}
          path: test-output.txt
          retention-days: 14
      # Anonymous users cannot read job logs, so on failure we mirror the
      # verdict, any race reports, and the failing tests' own messages
      # into step annotations, which the annotations API does expose.
      - name: Report failures as annotations
        if: steps.gots.outputs.status != '0'
        run: |
          # POSIX grep -E has no \t escape: match the tab with [[:blank:]]
          # so the panic dump's "running tests:" entries surface too.
          grep -E '^(--- FAIL|FAIL|panic)|WARNING: DATA RACE|Found [0-9]+ data race' test-output.txt | head -8 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          # go test prints each t.Fatal/t.Errorf message as an indented
          # file:line: entry under the failing test; mirroring those tells
          # anonymous readers WHICH wait fired, not just that one did.
          grep -E '^[[:blank:]]+[A-Za-z0-9_.-]+\.go:[0-9]+:' test-output.txt | head -8 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          grep -E '^(running tests:|[[:blank:]]+Test[A-Za-z0-9_]+ \()' test-output.txt | head -8 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          exit 1

  tidy:
    name: Module and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go mod tidy
      - name: Require a clean module graph
        run: git diff --exit-code -- go.mod go.sum
      - name: Require gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go mod download
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go mod download
      - name: Fuzz the terminal parser
        run: go test -run=^$ -fuzz=FuzzParserNeverPanics -fuzztime=30s ./internal/terminal
      - name: Fuzz the text input invariants
        run: go test -run=^$ -fuzz=FuzzTextInputInvariants -fuzztime=30s ./ui

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - run: go mod download
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - run: go mod download
      - run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Report total coverage
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14
