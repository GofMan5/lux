name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.23.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod download
      - name: Run go test -race ./...
        id: gots
        shell: bash
        continue-on-error: true
        run: |
          set +e
          go test -race -count=1 ./... > test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      # Anonymous users cannot read job logs, so on failure we mirror the
      # verdict and any race reports into step annotations, which the
      # annotations API does expose.
      - name: Report failures as annotations
        if: steps.gots.outputs.status != '0'
        shell: bash
        run: |
          grep -E '^(--- FAIL|FAIL|panic)|WARNING: DATA RACE|Found [0-9]+ data race|^\t+Test[A-Za-z0-9_]+ \(' test-output.txt | head -8 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1
      - run: go vet ./...

  e2e:
    name: E2E PTY (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: e2e/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...

  ssh-example:
    name: SSH example (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/07-ssh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: examples/07-ssh/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build .
      - name: Run go test -race ./...
        id: gots
        continue-on-error: true
        run: |
          set +e
          go test -race -count=1 ./... > test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      # Anonymous users cannot read job logs, so on failure we mirror the
      # verdict and any race reports into step annotations, which the
      # annotations API does expose.
      - name: Report failures as annotations
        if: steps.gots.outputs.status != '0'
        run: |
          grep -E '^(--- FAIL|FAIL|panic)|WARNING: DATA RACE|Found [0-9]+ data race|^\t+Test[A-Za-z0-9_]+ \(' test-output.txt | head -8 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

  tidy:
    name: Module and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go mod tidy
      - name: Require a clean module graph
        run: git diff --exit-code -- go.mod go.sum
      - name: Require gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go mod download
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go mod download
      - name: Fuzz the terminal parser
        run: go test -run=^$ -fuzz=FuzzParserNeverPanics -fuzztime=30s ./internal/terminal
      - name: Fuzz the text input invariants
        run: go test -run=^$ -fuzz=FuzzTextInputInvariants -fuzztime=30s ./ui

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - run: go mod download
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - run: go mod download
      - run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Report total coverage
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14
